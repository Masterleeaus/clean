name: Record documentation Pass 4

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/update-pass4-status-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Update status and plan
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('docs/DOCUMENTATION_RECONCILIATION_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          marker = '## Pass 1 exact duplicates removed\n'
          section = '''## Pass 4 — PWA, offline runtime and duplicated Chatbot surfaces

**Status:** Completed for documentation classification and evidence gathering. Runtime removal and security repair remain focused implementation work.

### Canonical documents and evidence

- `docs/architecture/PWA_OFFLINE_AND_CHATBOT_EXTENSION_ARCHITECTURE.md`
- `docs/inventory/PWA_OFFLINE_RUNTIME_INVENTORY.md`
- `docs/inventory/PWA_OFFLINE_RUNTIME_INVENTORY.json`

### Runtime findings

1. `app/Extensions/Chatbot` is the canonical intended Chatbot/PWA extension.
2. The primary extension contains 1,548 files; `app/Extensions/TitanZeroChatbot` contains 1,542.
3. The trees share 1,542 relative paths: 1,541 are byte-identical and only `System/ChatbotServiceProvider.php` differs.
4. The primary contains six additional Titan Train files and its native workspace test.
5. External source references overwhelmingly use the primary namespace and provider; no secondary namespace/provider references were found outside documentation/reference paths.
6. The primary provider uses `TitanZeroFeatureFlags` and conditionally registers WorkCore integrations.
7. The secondary provider registers WorkCore AI/runtime integration unconditionally and is superseded as current bootstrap behaviour.
8. Each tree contains 93 migrations and 40 provider-like files, creating a high duplicate-activation risk.
9. The canonical PWA includes a versioned service worker, IndexedDB version 5, AES-256-GCM device vault, persistent outbox, conflict store, sync inbox and push/pull/acknowledgement engine.
10. The service worker intentionally excludes authenticated APIs and sensitive paths from caching and wakes authenticated clients rather than reading IndexedDB or credentials directly.
11. The generic outbox persists operation headers and bodies directly; production verification must prove no secrets enter queued payloads or add encryption before persistence.
12. The device ID is stored in localStorage and must be treated only as an identifier, never as authorization proof.

### Pass 4 deletion policy

Not deleted:

- either complete Chatbot extension;
- the secondary 1,542-file compatibility tree;
- any IndexedDB store, migration, service worker, outbox or local record;
- extension-local reports or provenance files.

The secondary extension requires a focused source PR with registry, provider, route, migration, asset, installer, updater and rollback evidence before removal.

'''
          if section not in status:
              if marker not in status:
                  raise SystemExit('Pass 1 duplicate marker not found')
              status = status.replace(marker, section + marker)

          old_next = '''## Next pass

### Pass 4 — PWA, offline runtime and duplicated Chatbot surfaces

1. Inventory service workers, manifests, IndexedDB schemas, vaults, outboxes, retry and conflict implementations.
2. Compare `app/Extensions/Chatbot` with `app/Extensions/TitanZeroChatbot` beyond the TitanAI subtree.
3. Establish the canonical PWA extension and compatibility boundary.
4. Map device DTOs and sync envelopes to canonical WorkCore contracts.
5. Identify duplicate service-worker caches, local databases, routes, providers and assets.
6. Produce one source-backed PWA/offline architecture specification.
7. Remove only exact duplicates or fully preserved superseded documentation; leave runtime deletion to focused source PRs with dependency evidence.
'''
          new_next = '''## Next pass

### Pass 5 — extension platform, modules and capability manifests

1. Inventory extension registries, discovery paths, manifests, package gates and marketplace activation.
2. Classify extensions as canonical, optional, dormant, compatibility-only, donor/reference or superseded.
3. Detect duplicate providers, migrations, routes, menus, permissions and capability keys.
4. Establish one extension lifecycle and qualification specification.
5. Map extension capabilities to host identity and WorkCore authority boundaries.
6. Consolidate unique requirements from extension-platform reference documents.
7. Remove only exact duplicates or fully preserved superseded documentation; runtime changes remain focused implementation PRs.
'''
          if old_next not in status:
              raise SystemExit('Expected Pass 4 next-pass block not found')
          status_path.write_text(status.replace(old_next, new_next), encoding='utf-8')

          plan_path = Path('docs/plans/CURRENT_UPGRADE_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          old = '''10. The TitanAI trees under `app/Extensions/Chatbot` and `app/Extensions/TitanZeroChatbot` contained 864 byte-identical files at Pass 3 inventory time; the second tree remains frozen compatibility/reference material pending focused source reconciliation.
11. Embedded Chatbot WorkCore server code remains compatibility/reference-only and must not shadow `app/Domains/WorkCore`.
'''
          new = '''10. The TitanAI trees under `app/Extensions/Chatbot` and `app/Extensions/TitanZeroChatbot` contained 864 byte-identical files at Pass 3 inventory time.
11. Full Pass 4 comparison found 1,541 byte-identical files, one divergent provider and six primary-only Titan Train files across the complete extension trees.
12. `app/Extensions/Chatbot` is the canonical intended PWA extension; the secondary tree remains frozen compatibility/reference material pending focused source reconciliation.
13. The primary provider feature-gates WorkCore/TitanAI integration, while the secondary provider registers those integrations unconditionally and must not be activated.
14. The PWA source contains IndexedDB version 5, an AES-256-GCM device vault, service-worker safeguards, outbox/conflict state and a cursor-based sync engine.
15. The generic outbox stores headers and bodies directly, so queued payloads require a no-secrets guarantee or encryption before production release.
16. Embedded Chatbot WorkCore server code remains compatibility/reference-only and must not shadow `app/Domains/WorkCore`.
'''
          if old not in plan:
              raise SystemExit('Expected Pass 3 findings block not found in plan')
          plan = plan.replace(old, new)
          old_phase = '''### Phase 8 — PWA and offline alignment

1. Match IndexedDB schemas to canonical WorkCore DTOs and versions.
2. Standardise UUID, company, actor and device fields.
3. Validate vault encryption, outbox retry, conflict handling and background sync.
4. Prevent secrets and sensitive responses entering service-worker caches.
5. Add local schema migration and rollback handling.
6. Test offline create/update/delete and later reconciliation.
7. Verify device trust, revocation and tenant-switch behaviour.
'''
          new_phase = '''### Phase 8 — PWA and offline alignment

1. Retain `app/Extensions/Chatbot` as the canonical PWA extension and keep the secondary tree disabled until focused removal evidence exists.
2. Match IndexedDB schemas to canonical WorkCore DTOs and versions.
3. Standardise UUID, company, actor and device fields.
4. Validate vault encryption, lock/reset behaviour, outbox retry, conflict handling and background sync.
5. Prove queued headers and bodies contain no secrets or encrypt sensitive payloads before IndexedDB persistence.
6. Prevent secrets and sensitive responses entering service-worker caches.
7. Add local schema migration and rollback handling.
8. Test offline create/update/delete and later reconciliation.
9. Verify device trust, revocation, multi-user browser isolation and tenant-switch behaviour.
10. Remove the secondary extension only after provider, route, migration, asset, registry, installer and rollback checks pass.
'''
          if old_phase not in plan:
              raise SystemExit('Expected Phase 8 block not found')
          plan_path.write_text(plan.replace(old_phase, new_phase), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/update-pass4-status-plan.yml

      - name: Commit Pass 4 documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record PWA offline reconciliation Pass 4"
          git push origin HEAD:agent/documentation-reconciliation
