name: Import Titan Money and Titan Pay v0.5.0 Source

on:
  push:
    branches:
      - agent/titan-money-pay-chat-upgrade
    paths:
      - .github/workflows/import-titan-money-pay-v050-source.yml
      - source-packs/titan-money-titan-pay-v0.5.0/.import-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-titan-money-pay-v050-source
  cancel-in-progress: false

jobs:
  import-source:
    if: github.ref == 'refs/heads/agent/titan-money-pay-chat-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@v4
        with:
          ref: agent/titan-money-pay-chat-upgrade
          fetch-depth: 0

      - name: Download and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/TitanZero-Meetup-TitanMoney-TitanPay-v0.5.0-FULL.zip
          curl -fL --retry 5 --retry-all-errors \
            'https://titan-v050-binary-transport.miniup.app/TitanZero-Meetup-TitanMoney-TitanPay-v0.5.0-FULL.zip' \
            -o "$archive"
          echo '7758320397db5d3e180fbc7b27e831a9a8590769dd6a11de45357d6eb73ec858  /tmp/TitanZero-Meetup-TitanMoney-TitanPay-v0.5.0-FULL.zip' | sha256sum --check
          test "$(stat -c '%s' "$archive")" = '984427'

      - name: Extract into isolated source pack
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/TitanZero-Meetup-TitanMoney-TitanPay-v0.5.0-FULL.zip
          extraction=/tmp/titan-money-pay-v050
          destination=source-packs/titan-money-titan-pay-v0.5.0
          rm -rf "$extraction" "$destination"
          mkdir -p "$extraction" "$destination"
          unzip -q "$archive" -d "$extraction"
          source_root="$extraction/meetup-titan-money-titan-pay"
          test -f "$source_root/artisan"
          test -f "$source_root/app/Domains/TitanMoney/TitanMoneyServiceProvider.php"
          test -f "$source_root/app/Domains/TitanPay/TitanPayServiceProvider.php"
          file_count="$(find "$source_root" -type f | wc -l | tr -d ' ')"
          test "$file_count" = '404'
          cp -a "$source_root"/. "$destination"/
          rm -f "$destination/.import-trigger"
          cat > "$destination/STAGED_SOURCE_NOTICE.md" <<'NOTICE'
          # Staged source notice

          This directory contains the extracted Titan Money + Titan Pay v0.5.0 donor application.

          It is deliberately outside the Laravel runtime. Do not add it to Composer autoloading or copy its application shell over the MagicAI host. Integrate files only after the ownership, collision, dependency, tenancy and security reviews defined in the root upgrade plan.
          NOTICE

      - name: Validate staged source safety
        shell: bash
        run: |
          set -euo pipefail
          destination=source-packs/titan-money-titan-pay-v0.5.0
          test ! -e "$destination/.env"
          test ! -d "$destination/vendor"
          test ! -d "$destination/node_modules"
          test ! -d "$destination/public/build"
          test -f "$destination/README_TITAN_MONEY_TITAN_PAY.md"
          test -f "$destination/composer.json"
          test -f "$destination/package.json"
          php_files="$(find "$destination" -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$php_files" -ge '290'

      - name: Commit extracted source pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Titan Zero Source Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A source-packs/titan-money-titan-pay-v0.5.0
          if git diff --cached --quiet; then
            echo 'Source pack already matches the verified archive.'
            exit 0
          fi
          git commit -m 'Stage extracted Titan Money and Titan Pay v0.5.0 source'
          git push origin HEAD:agent/titan-money-pay-chat-upgrade
