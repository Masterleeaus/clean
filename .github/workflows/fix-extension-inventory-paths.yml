name: Correct extension inventory provider paths

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/fix-extension-inventory-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Correct namespace to filesystem mapping
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/docs/inventory_extension_platform.py')
          text = path.read_text(encoding='utf-8')
          old = '''        provider_path = ROOT / (fqcn.replace("\\\\", "/") + ".php")\n        if not provider_path.is_file():\n'''
          new = '''        if fqcn.startswith("App\\\\"):\n            provider_relative = "app/" + fqcn[len("App\\\\"):].replace("\\\\", "/") + ".php"\n        else:\n            provider_relative = fqcn.replace("\\\\", "/") + ".php"\n        provider_path = ROOT / provider_relative\n        if not provider_path.is_file():\n'''
          if old not in text:
              raise SystemExit('Expected provider path expression not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Regenerate extension inventory
        run: python3 scripts/docs/inventory_extension_platform.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-extension-inventory-paths.yml

      - name: Commit corrected inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: correct provider path reconciliation evidence"
          git push origin HEAD:agent/documentation-reconciliation
