name: Apply Route Inspection Safety Repair

on:
  pull_request:
    branches:
      - agent/gpt56-titan-zero-upgrade-review-base
    paths:
      - .github/route-inspection-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact controller repair
        run: php tools/titan-zero-audit/apply-route-inspection-safety.php

      - name: Verify syntax and source contract
        run: |
          php -l app/Http/Controllers/Api/AIChatController.php
          php tests/Feature/Bootstrap/RouteInspectionSafetyTest.php

      - name: Commit repaired controller
        run: |
          if git diff --quiet -- app/Http/Controllers/Api/AIChatController.php; then
            echo "Controller already repaired."
            exit 0
          fi
          git config user.name "Titan Zero Pass 2 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/Http/Controllers/Api/AIChatController.php
          git commit -m "fix: defer AI chat runtime setup until request execution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
