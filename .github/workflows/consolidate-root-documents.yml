name: Consolidate root documentation

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/consolidate-root-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-root-documents
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Verify expected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/documentation-reconciliation"

      - name: Consolidate root documentation
        run: python3 scripts/docs/consolidate_root_documents.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/consolidate-root-documents.yml

      - name: Commit consolidation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consolidation changes were required."
            exit 0
          fi
          git commit -m "docs: consolidate repository root documents"
          git push origin HEAD:agent/documentation-reconciliation
