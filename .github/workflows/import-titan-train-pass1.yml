name: Import Titan Train Pass 1 reconciliation

on:
  push:
    branches:
      - agent/titan-train-lms
    paths:
      - .github/workflows/import-titan-train-pass1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-pass1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout LMS branch
        uses: actions/checkout@v4
        with:
          ref: agent/titan-train-lms
          fetch-depth: 0

      - name: Download and verify reconciliation payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://titan-train-pass1-transport.miniup.app/pass1-payload.zip \
            -o /tmp/pass1-payload.zip
          echo "492bb74938fee5966232de6a4c9409c1fdafff24dfd329df6343c36abdd5b5b2  /tmp/pass1-payload.zip" | sha256sum --check

      - name: Import reports and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/pass1-payload.zip -d .
          rm -f .github/workflows/import-titan-train-pass1.yml
          git config user.name "Titan Train Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add TITAN_TRAIN_LMS_BRANCH.md PASS1_STATUS.md docs/architecture docs/merge .github/workflows/import-titan-train-pass1.yml
          git commit -m "docs: complete Titan Train LMS pass 1 reconciliation"
          git push origin HEAD:agent/titan-train-lms
