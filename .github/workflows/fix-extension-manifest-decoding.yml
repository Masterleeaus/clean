name: Correct extension manifest decoding

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/fix-extension-manifest-decoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Use BOM-aware JSON decoding
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/docs/inventory_extension_platform.py')
          text = path.read_text(encoding='utf-8')
          old = 'return json.loads(path.read_text(encoding="utf-8"))'
          new = 'return json.loads(path.read_text(encoding="utf-8-sig"))'
          if old not in text:
              raise SystemExit('Expected JSON decoder not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Regenerate inventory and gap summary
        run: |
          python3 scripts/docs/inventory_extension_platform.py
          python3 scripts/docs/summarise_extension_gaps.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-extension-manifest-decoding.yml

      - name: Commit corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: decode legacy BOM extension manifests correctly"
          git push origin HEAD:agent/documentation-reconciliation
