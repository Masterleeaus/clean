name: Import Titan Train LMS source pack

on:
  push:
    branches:
      - agent/titan-train-lms
    paths:
      - .github/workflows/import-titan-train-lms-source-pack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout LMS branch
        uses: actions/checkout@v4
        with:
          ref: agent/titan-train-lms
          fetch-depth: 0

      - name: Skip when source pack is already present
        id: existing
        shell: bash
        run: |
          if [ -f source-packs/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download encrypted transport parts
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/titan-train-import
          curl -fL --retry 5 --retry-all-errors \
            https://titan-train-lms-transport-000.miniup.app/source.enc.part-000 \
            -o /tmp/titan-train-import/source.enc.part-000
          curl -fL --retry 5 --retry-all-errors \
            https://titan-train-lms-transport-001.miniup.app/source.enc.part-001 \
            -o /tmp/titan-train-import/source.enc.part-001
          curl -fL --retry 5 --retry-all-errors \
            https://titan-train-lms-transport-002.miniup.app/source.enc.part-002 \
            -o /tmp/titan-train-import/source.enc.part-002

      - name: Verify encrypted transport
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "30fb1eb83686ba91730765ef61d2fc7b867c822ca8ce78f1d93cf7eda3c3e308  /tmp/titan-train-import/source.enc.part-000" | sha256sum --check
          echo "bc0c01d3e085c4b54b3fd41634c3f5b370f3df03da2d59980765508ad89d0759  /tmp/titan-train-import/source.enc.part-001" | sha256sum --check
          echo "a00da07b4e1aed1b84bc84948c38faac6647f42cb59a329fbf4aa18a3513b823  /tmp/titan-train-import/source.enc.part-002" | sha256sum --check
          cat /tmp/titan-train-import/source.enc.part-* > /tmp/titan-train-import/source.zip.enc
          echo "1b5b041f6616d54675176f9c437e99592a19839782d3fb5f35cbcb13eb1b2100  /tmp/titan-train-import/source.zip.enc" | sha256sum --check

      - name: Decrypt and verify source pack
        if: steps.existing.outputs.present != 'true'
        shell: bash
        env:
          TITAN_TRAIN_TRANSPORT_KEY: 004f4fcce1a8ad717eea54b898ee643b884719a6c2628b8f360f307ef63db1a7
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in /tmp/titan-train-import/source.zip.enc \
            -out /tmp/titan-train-import/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip \
            -pass env:TITAN_TRAIN_TRANSPORT_KEY
          echo "77bb614bccd90f8049efb3ef2f9285dd835e67fafd1505b48f8082aac69153d6  /tmp/titan-train-import/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip" | sha256sum --check
          unzip -tq /tmp/titan-train-import/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip

      - name: Commit source pack to LMS branch
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-packs
          cp /tmp/titan-train-import/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip source-packs/
          printf '%s  %s\n' \
            '77bb614bccd90f8049efb3ef2f9285dd835e67fafd1505b48f8082aac69153d6' \
            'Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip' \
            > source-packs/SHA256SUMS.txt
          git config user.name "Titan Train Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add source-packs/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip source-packs/SHA256SUMS.txt
          git commit -m "chore: import Titan Train LMS donor core pack"
          git push origin HEAD:agent/titan-train-lms
