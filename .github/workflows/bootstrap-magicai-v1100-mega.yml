name: Bootstrap MagicAI and AI Site Builder on isolated branch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ai-site-builder-bridge
    paths:
      - .github/workflows/bootstrap-magicai-v1100-mega.yml
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-site-builder-bridge-bootstrap
  cancel-in-progress: false

jobs:
  import-sources:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.issue.title == 'BOOTSTRAP AI SITE BUILDER BRIDGE'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TARGET_BRANCH: agent/ai-site-builder-bridge
      MAGICAI_URL: https://mega.nz/file/edcEzSJZ#iHrQEPJb8E7xDcg0QUatncsokg_GTarzpNwjo5GwXwE
      MAGICAI_FILE: MagicAI-v11.00-source-clean.zip
      MAGICAI_SHA256: ed6ce50730150601ccea6577fa72c65c3e33db127e2af0064d18e7738fe57d57
      MAGICAI_EXPECTED_FILE_COUNT: '5020'
      SITE_BUILDER_URL: https://mega.nz/file/jEkGlYLQ#5JGOpAIrTHd761L8TDGzgzO5grne6bN5t-U1MuxWwbY
      SITE_BUILDER_FILE: ai-powered-site-builder.zip

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools unzip p7zip-full rsync

      - name: Download and verify MagicAI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "/tmp/$MAGICAI_FILE"
          megadl "$MAGICAI_URL" --path "/tmp/$MAGICAI_FILE"
          printf '%s  %s\n' "$MAGICAI_SHA256" "/tmp/$MAGICAI_FILE" | sha256sum --check --strict
          unzip -t "/tmp/$MAGICAI_FILE"
          actual_count="$(zipinfo -1 "/tmp/$MAGICAI_FILE" | awk 'substr($0, length($0), 1) != "/"' | wc -l | tr -d ' ')"
          test "$actual_count" = "$MAGICAI_EXPECTED_FILE_COUNT"

      - name: Extract and validate MagicAI
        shell: bash
        run: |
          set -euo pipefail
          extract=/tmp/magicai-v1100-source
          rm -rf "$extract"
          mkdir -p "$extract"
          unzip -q "/tmp/$MAGICAI_FILE" -d "$extract"
          test -f "$extract/artisan"
          test -f "$extract/composer.json"
          test -f "$extract/composer.lock"
          test -d "$extract/app"
          test -d "$extract/routes"
          test -d "$extract/database"
          test -f "$extract/public/index.php"
          ! find "$extract" -type d \( -name vendor -o -name node_modules -o -name .git \) -print -quit | grep -q .
          ! find "$extract" -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ed25519' \) -print -quit | grep -q .

      - name: Download and inspect AI site builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f "/tmp/$SITE_BUILDER_FILE"
          megadl "$SITE_BUILDER_URL" --path "/tmp/$SITE_BUILDER_FILE"
          test -s "/tmp/$SITE_BUILDER_FILE"
          7z t "/tmp/$SITE_BUILDER_FILE"
          sha256sum "/tmp/$SITE_BUILDER_FILE" | tee /tmp/site-builder.sha256

      - name: Extract and sanitise AI site builder
        shell: bash
        run: |
          set -euo pipefail
          raw=/tmp/site-builder-raw
          source=/tmp/site-builder-source
          rm -rf "$raw" "$source"
          mkdir -p "$raw" "$source"
          7z x -y -o"$raw" "/tmp/$SITE_BUILDER_FILE" >/dev/null
          mapfile -t roots < <(find "$raw" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [[ ${#roots[@]} -eq 1 && -d "${roots[0]}" ]]; then
            rsync -a "${roots[0]}/" "$source/"
          else
            rsync -a "$raw/" "$source/"
          fi
          find "$source" -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ed25519' \) -delete
          find "$source" -type d \( -name .git -o -name node_modules -o -name vendor -o -name dist \) -prune -exec rm -rf {} +
          test -f "$source/package.json"
          test -d "$source/src"
          test -d "$source/supabase"
          test "$(find "$source" -type f | wc -l)" -gt 50

      - name: Merge sources into isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete-delay \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='integrations/' \
            /tmp/magicai-v1100-source/ ./
          rm -rf external/ai-site-builder
          mkdir -p external/ai-site-builder docs/integrations
          rsync -a /tmp/site-builder-source/ external/ai-site-builder/
          builder_sha="$(cut -d' ' -f1 /tmp/site-builder.sha256)"
          builder_count="$(find external/ai-site-builder -type f | wc -l | tr -d ' ')"
          cat > docs/integrations/AI_SITE_BUILDER_SOURCE_IMPORT.md <<EOF
          # AI Site Builder source import

          Imported only on branch \`agent/ai-site-builder-bridge\`.

          - Source: user-supplied MEGA archive
          - Download SHA-256: \`$builder_sha\`
          - Sanitised source files: \`$builder_count\`
          - Removed: \`.env\`, private-key formats, \`.git/\`, \`vendor/\`, \`node_modules/\`, and stale \`dist/\`
          - Install target: \`external/ai-site-builder/\`
          EOF

      - name: Apply the two-sided bridge
        shell: bash
        run: |
          set -euo pipefail
          bash integrations/ai-site-builder/apply.sh "$GITHUB_WORKSPACE"
          test -f app/Extensions/AiSiteBuilderBridge/extension.json
          test -f external/ai-site-builder/supabase/functions/titan-bridge/index.ts
          test -f external/ai-site-builder/supabase/migrations/20260730010000_add_titan_zero_bridge.sql
          ! find external/ai-site-builder -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .

      - name: Commit branch-only source and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were detected.'
            exit 0
          fi
          git commit -m 'feat: import and wire AI site builder on isolated branch'
          git push origin HEAD:"$TARGET_BRANCH"
