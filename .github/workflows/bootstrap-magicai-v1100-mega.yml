name: Bootstrap MagicAI WorkCore and AI Site Builder on isolated branch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ai-site-builder-bridge
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ai-site-builder-bridge-bootstrap
  cancel-in-progress: false

jobs:
  import-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TARGET_BRANCH: agent/ai-site-builder-bridge
      MAGICAI_WORKCORE_SOURCE_BRANCH: agent/import-magicai-workcore-chatbot
      SITE_BUILDER_URL: https://mega.nz/file/jEkGlYLQ#5JGOpAIrTHd761L8TDGzgzO5grne6bN5t-U1MuxWwbY
      SITE_BUILDER_FILE: ai-powered-site-builder.zip

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools p7zip-full rsync unzip

      - name: Materialise verified MagicAI WorkCore source branch
        shell: bash
        run: |
          set -euo pipefail
          source=/tmp/magicai-workcore-source
          rm -rf "$source"
          git fetch origin "$MAGICAI_WORKCORE_SOURCE_BRANCH:refs/remotes/origin/$MAGICAI_WORKCORE_SOURCE_BRANCH"
          git worktree add --detach "$source" "origin/$MAGICAI_WORKCORE_SOURCE_BRANCH"
          git -C "$source" rev-parse HEAD | tee /tmp/magicai-workcore-source.sha
          test -f "$source/artisan"
          test -f "$source/composer.json"
          test -f "$source/composer.lock"
          test -f "$source/public/index.php"
          test -f "$source/app/Domains/WorkCore/WorkCoreServiceProvider.php"
          test -f "$source/app/Domains/WorkCore/System/Contracts/TenantContextContract.php"
          test -f "$source/app/Domains/WorkCore/System/Contracts/PermissionResolverContract.php"
          ! find "$source" -type d \( -name vendor -o -name node_modules \) -print -quit | grep -q .
          ! find "$source" -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ed25519' \) -print -quit | grep -q .

      - name: Download and inspect AI site builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f "/tmp/$SITE_BUILDER_FILE"
          megadl "$SITE_BUILDER_URL" --path "/tmp/$SITE_BUILDER_FILE"
          test -s "/tmp/$SITE_BUILDER_FILE"
          7z t "/tmp/$SITE_BUILDER_FILE"
          sha256sum "/tmp/$SITE_BUILDER_FILE" | tee /tmp/site-builder.sha256

      - name: Extract and sanitise AI site builder
        shell: bash
        run: |
          set -euo pipefail
          raw=/tmp/site-builder-raw
          source=/tmp/site-builder-source
          rm -rf "$raw" "$source"
          mkdir -p "$raw" "$source"
          7z x -y -o"$raw" "/tmp/$SITE_BUILDER_FILE" >/dev/null
          mapfile -t roots < <(find "$raw" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [[ ${#roots[@]} -eq 1 && -d "${roots[0]}" ]]; then
            rsync -a "${roots[0]}/" "$source/"
          else
            rsync -a "$raw/" "$source/"
          fi
          find "$source" -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ed25519' \) -delete
          find "$source" -type d \( -name .git -o -name node_modules -o -name vendor -o -name dist \) -prune -exec rm -rf {} +
          test -f "$source/package.json"
          test -d "$source/src"
          test -d "$source/supabase"
          test "$(find "$source" -type f | wc -l)" -gt 50

      - name: Merge source trees into isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete-delay \
            --exclude='.git' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='integrations/' \
            /tmp/magicai-workcore-source/ ./
          rm -rf external/ai-site-builder
          mkdir -p external/ai-site-builder docs/integrations
          rsync -a /tmp/site-builder-source/ external/ai-site-builder/
          builder_sha="$(cut -d' ' -f1 /tmp/site-builder.sha256)"
          builder_count="$(find external/ai-site-builder -type f | wc -l | tr -d ' ')"
          source_sha="$(cat /tmp/magicai-workcore-source.sha)"
          cat > docs/integrations/AI_SITE_BUILDER_SOURCE_IMPORT.md <<EOF
          # AI Site Builder source import

          Imported only on branch \`agent/ai-site-builder-bridge\`.

          - MagicAI WorkCore source branch: \`$MAGICAI_WORKCORE_SOURCE_BRANCH\`
          - MagicAI WorkCore source commit: \`$source_sha\`
          - Builder source: user-supplied MEGA archive
          - Builder download SHA-256: \`$builder_sha\`
          - Sanitised builder source files: \`$builder_count\`
          - Removed: \`.env\`, private-key formats, \`.git/\`, \`vendor/\`, \`node_modules/\`, and stale \`dist/\`
          - Builder install target: \`external/ai-site-builder/\`
          EOF

      - name: Apply the two-sided bridge
        shell: bash
        run: |
          set -euo pipefail
          bash integrations/ai-site-builder/apply.sh "$GITHUB_WORKSPACE"
          test -f app/Extensions/AiSiteBuilderBridge/extension.json
          test -f external/ai-site-builder/supabase/functions/titan-bridge/index.ts
          test -f external/ai-site-builder/supabase/migrations/20260730010000_add_titan_zero_bridge.sql
          ! find external/ai-site-builder -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .

      - name: Commit branch-only source and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes were detected.'
            exit 0
          fi
          git commit -m 'feat: import and wire AI site builder on isolated branch'
          git push origin HEAD:"$TARGET_BRANCH"
