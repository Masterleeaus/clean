name: Documentation reconciliation pass 1

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/documentation-reconciliation-pass1.yml'
      - 'scripts/docs/reconcile_pass1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-reconciliation-pass1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Verify extraction evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/inventory/archive_inventory.json
          test -f docs/inventory/documentation_catalogue.json
          test -d docs/inbox/archive-1
          test -d docs/inbox/archive-2

      - name: Apply conservative documentation sorting pass
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/docs/reconcile_pass1.py | tee /tmp/documentation-reconciliation-pass1.json

      - name: Verify canonical documentation entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/README.md
          test -f docs/plans/CURRENT_UPGRADE_PLAN.md
          test -f docs/governance/DOCUMENTATION_POLICY.md
          test -f docs/reference/titan-library/README.md
          test -f docs/inventory/PASS1_DISPOSITIONS.md
          test ! -f docs/Archive.zip
          test ! -f 'docs/Archive 2.zip'
          test ! -f DEV-SETUP.md
          test ! -f UPGRADE_STATUS.md

      - name: Commit reconciliation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No documentation reconciliation changes to commit.'
            exit 0
          fi
          git commit -m 'docs: sort reference library and archive superseded records'
          git push origin HEAD:agent/documentation-reconciliation
