name: Refresh current coordination baseline

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/refresh-current-coordination-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Update current baseline fields only
        shell: python
        run: |
          from pathlib import Path

          old = 'fa607d769a4f72ba287801b027cc42dcf56aa549'
          new = '49a563505a6f2706fb342a70b032c3170e0e480e'
          paths = [
              Path('docs/DOCUMENTATION_RECONCILIATION_STATUS.md'),
              Path('docs/plans/CURRENT_UPGRADE_PLAN.md'),
              Path('docs/inventory/PR_SCOPE.md'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  print(f'No stale baseline in {path}')
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'Updated {path}')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/refresh-current-coordination-baseline.yml

      - name: Commit refreshed baseline metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: align current records with fresh coordination baseline"
          git push origin HEAD:agent/documentation-reconciliation
