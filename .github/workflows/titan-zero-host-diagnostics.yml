name: Titan Zero Host Diagnostics

on:
  push:
    branches:
      - agent/titan-zero-pwa-upgrade
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-zero-host-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  CACHE_DRIVER: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array
  INTERACTION_AI_ENABLED: "false"
  INTERACTION_OFFLINE_ENABLED: "true"
  INTERACTION_APPROVAL_SECRET: pass1-ci-approval-secret
  INTERACTION_OUTBOX_SECRET: pass1-ci-outbox-secret

jobs:
  diagnose-host:
    if: "${{ !contains(github.event.head_commit.message || '', 'ci: record Pass 1 diagnostics') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/titan-zero-pwa-upgrade
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, fileinfo, intl, json, mbstring, openssl, pdo, pdo_sqlite, sodium, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Run diagnostic pipeline and persist evidence
        shell: bash
        run: |
          set -uo pipefail
          cp .env.example .env
          mkdir -p database storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache docs/passes
          rm -f database/database.sqlite
          touch database/database.sqlite
          report=docs/passes/PASS1_CI_DIAGNOSTICS.md
          work=/tmp/titan-pass1-diagnostics
          mkdir -p "$work"
          overall=0

          run_check() {
            name="$1"
            shift
            log="$work/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then overall=1; fi
            {
              printf '\n## %s\n\n' "$name"
              printf -- '- Exit code: `%s`\n\n' "$status"
              printf '```text\n'
              tail -n 120 "$log"
              printf '\n```\n'
            } >> "$report.tmp"
          }

          cat > "$report.tmp" <<'EOF'
          # Pass 1 CI Diagnostics

          Generated by the failure-safe host diagnostic workflow. No environment secrets are included.
          EOF

          run_check php-version php -v
          run_check php-extensions php -m
          run_check composer-version composer --version
          run_check composer-validate composer validate --no-check-publish --no-interaction
          run_check composer-install composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

          if [[ -f vendor/autoload.php ]]; then
            run_check artisan-about php artisan about
            run_check migrations php artisan migrate --force
            run_check interaction-routes php artisan route:list --path=interaction
            run_check host-boot-tests php artisan test --filter=HostBootTest
          else
            printf '\n## Laravel boot stages\n\nSkipped because `vendor/autoload.php` was not created.\n' >> "$report.tmp"
            overall=1
          fi

          run_check static-host-contracts python3 tests/contracts/titan_zero_host_boot_contract_test.py
          run_check interaction-engine-tests php packages/titanzero/interaction-engine/tests/run.php

          {
            printf '\n## Result\n\n'
            if [[ $overall -eq 0 ]]; then
              printf '**PASS** — every diagnostic stage succeeded.\n'
            else
              printf '**FAIL** — one or more stages failed; inspect the first non-zero exit code above.\n'
            fi
          } >> "$report.tmp"

          mv "$report.tmp" "$report"
          git config user.name "Titan Zero CI"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain -- "$report")" ]]; then
            git add "$report"
            git commit -m "ci: record Pass 1 diagnostics"
            git push origin HEAD:agent/titan-zero-pwa-upgrade
          fi

          exit "$overall"
