name: Reconcile documentation branch with latest main

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/merge-latest-main-into-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main integration/current-main-reconciliation
          git merge --no-ff origin/main -m "merge: reconcile documentation with latest main"

      - name: Consolidate newly introduced root documents
        run: python3 scripts/docs/consolidate_root_documents.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/merge-latest-main-into-docs.yml

      - name: Commit post-merge documentation adjustments
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: reclassify documents introduced by latest main"
          fi
          git push origin HEAD:agent/documentation-reconciliation
