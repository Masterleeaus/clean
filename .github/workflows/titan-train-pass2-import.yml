name: Titan Train Pass 2 import

on:
  pull_request_target:
    branches:
      - agent/import-all-extensions
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  import-pass2:
    if: github.event.pull_request.head.ref == 'agent/titan-train-lms-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repaired LMS branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Restore Pass 1 records and donor archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/titan-train-lms-pass1:refs/remotes/origin/archive/titan-train-lms-pass1
          for path in \
            TITAN_TRAIN_LMS_UPGRADE_PLAN.md \
            TITAN_TRAIN_LMS_BRANCH.md \
            PASS1_STATUS.md \
            source-packs \
            docs/architecture \
            docs/merge; do
            git checkout origin/archive/titan-train-lms-pass1 -- "$path" || true
          done

      - name: Download and decrypt Pass 2 payload
        shell: bash
        env:
          TITAN_TRAIN_PASS2_KEY: d4c9b064b356ff77ef4ff93ab89ec6ccdc5f2a0d24f152723a2a44a383ca0752
        run: |
          set -euo pipefail
          mkdir -p /tmp/titan-train-pass2
          curl -fL --retry 5 --retry-all-errors \
            https://titan-train-pass2-transport.miniup.app/pass2-payload.zip.enc \
            -o /tmp/titan-train-pass2/pass2-payload.zip.enc
          echo "db7de068fff030c49c82796f43ecf5a15597c8b3e06448fb2ede9ecec156d702  /tmp/titan-train-pass2/pass2-payload.zip.enc" | sha256sum --check
          printf '%s' "$TITAN_TRAIN_PASS2_KEY" > /tmp/titan-train-pass2/key.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/titan-train-pass2/pass2-payload.zip.enc \
            -out /tmp/titan-train-pass2/pass2-payload.zip \
            -pass file:/tmp/titan-train-pass2/key.txt
          echo "1d608d25bf39840fca61ea5ab58daa63b34b532736b6d844d4079f1e68cb439e  /tmp/titan-train-pass2/pass2-payload.zip" | sha256sum --check
          unzip -q -o /tmp/titan-train-pass2/pass2-payload.zip -d .

      - name: Verify Pass 2 source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Domains/TitanTrain/Infrastructure/Providers/TitanTrainServiceProvider.php
          test -f app/Domains/TitanTrain/Infrastructure/Migrations/2026_07_29_200000_create_titan_train_online_tables.php
          test -f public/chatbot-pwa/apps/titan-train.js
          test -f resources/titan-apps/TemplateSchemas/titan-train.json
          grep -q 'TitanTrainServiceProvider::class' config/app.php
          test "$(grep -R "Schema::create('tt_" -h app/Domains/TitanTrain/Infrastructure/Migrations/*.php | wc -l | tr -d ' ')" = "13"
          find app/Domains/TitanTrain tests/Feature/TitanTrain tests/Unit/TitanTrain -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/titan-train-pass2-php-lint.txt
          php -r 'require "app/Domains/TitanTrain/Domain/Blueprints/CleanerFoundationBlueprint.php"; $b = new App\\Domains\\TitanTrain\\Domain\\Blueprints\\CleanerFoundationBlueprint(); $lessons = array_sum(array_map(fn($m) => count($m["lessons"]), $b->modules())); if (count($b->modules()) !== 9 || $lessons !== 26 || count($b->assessments()) !== 2 || count($b->competencies()) !== 5) { exit(1); }'
          if grep -R -E 'IndexedDB|SQLCipher|sync_cursor|sync_conflict|offline_operation' app/Domains/TitanTrain public/chatbot-pwa/apps/titan-train.*; then
            echo 'Unexpected offline subsystem reference found.' >&2
            exit 1
          fi
          sha256sum source-packs/Titan-Train-LMS-Donor-Core-Pack-v1.1.0.zip | grep -q '^77bb614bccd90f8049efb3ef2f9285dd835e67fafd1505b48f8082aac69153d6 '
          {
            echo '# Titan Train Pass 2 Runner Verification'
            echo
            echo '- PHP version:' "$(php -r 'echo PHP_VERSION;')"
            echo '- Titan Train PHP files linted:' "$(grep -c 'No syntax errors detected' /tmp/titan-train-pass2-php-lint.txt)"
            echo '- tt_* tables: 13'
            echo '- Cleaner Foundation: 9 modules / 26 lessons / 2 assessments / 5 competencies'
            echo '- Provider registration: present'
            echo '- PWA bridge and template schema: present'
            echo '- Offline subsystem: excluded'
            echo '- Donor archive checksum: passed'
            echo '- Laravel runtime boot: blocked because vendor dependencies are not committed'
          } > docs/titan-train/PASS2-RUN-VERIFICATION.md

      - name: Commit Pass 2 to LMS branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Titan Train Integration Agent'
          git config user.email 'actions@users.noreply.github.com'
          rm -f TITAN_TRAIN_BRANCH_REPAIR_IN_PROGRESS.md
          git add -A
          git commit -m 'feat: integrate Titan Train LMS online core'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
