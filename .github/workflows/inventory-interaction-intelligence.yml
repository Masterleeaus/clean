name: Inventory Interaction and intelligence runtimes

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/inventory-interaction-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Generate runtime inventory
        run: python3 scripts/docs/inventory_interaction_intelligence.py

      - name: Remove one-time workflow
        run: rm -f .github/workflows/inventory-interaction-intelligence.yml

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: inventory Interaction Wizard and five-tier runtimes"
          git push origin HEAD:agent/documentation-reconciliation
