name: Extract and inventory documentation archives

on:
  push:
    branches:
      - agent/documentation-reconciliation
    paths:
      - '.github/workflows/extract-document-archives.yml'
      - 'docs/Archive.zip'
      - 'docs/Archive 2.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-archive-reconciliation
  cancel-in-progress: false

jobs:
  extract-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-reconciliation
          fetch-depth: 0

      - name: Safely extract both archives
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          archives = [
              (root / 'docs' / 'Archive.zip', root / 'docs' / 'inbox' / 'archive-1', 'archive-1'),
              (root / 'docs' / 'Archive 2.zip', root / 'docs' / 'inbox' / 'archive-2', 'archive-2'),
          ]

          inventory_dir = root / 'docs' / 'inventory'
          inventory_dir.mkdir(parents=True, exist_ok=True)
          archive_report: dict[str, object] = {'archives': []}

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          for archive_path, destination, label in archives:
              if not archive_path.is_file():
                  raise SystemExit(f'Missing required archive: {archive_path}')

              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)

              extracted: list[dict[str, object]] = []
              skipped: list[str] = []

              with zipfile.ZipFile(archive_path) as bundle:
                  bad_member = bundle.testzip()
                  if bad_member is not None:
                      raise SystemExit(f'CRC failure in {archive_path}: {bad_member}')

                  for member in bundle.infolist():
                      raw_name = member.filename.replace('\\', '/')
                      relative = PurePosixPath(raw_name)

                      if member.flag_bits & 0x1:
                          raise SystemExit(f'Encrypted ZIP member rejected: {raw_name}')
                      if relative.is_absolute() or '..' in relative.parts:
                          raise SystemExit(f'Unsafe ZIP path rejected: {raw_name}')
                      if '\x00' in raw_name:
                          raise SystemExit(f'NUL byte in ZIP path rejected: {raw_name}')
                      unix_mode = (member.external_attr >> 16) & 0xFFFF
                      if stat.S_ISLNK(unix_mode):
                          raise SystemExit(f'Symbolic link ZIP member rejected: {raw_name}')
                      if '__MACOSX' in relative.parts or relative.name == '.DS_Store':
                          skipped.append(raw_name)
                          continue
                      if not relative.parts:
                          continue

                      target = destination.joinpath(*relative.parts)
                      resolved_target = target.resolve()
                      resolved_destination = destination.resolve()
                      if resolved_destination not in resolved_target.parents and resolved_target != resolved_destination:
                          raise SystemExit(f'ZIP member escaped destination: {raw_name}')

                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue

                      target.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.open(member, 'r') as source, target.open('wb') as sink:
                          shutil.copyfileobj(source, sink)

                      extracted.append({
                          'path': target.relative_to(root).as_posix(),
                          'archive_path': raw_name,
                          'size': target.stat().st_size,
                          'sha256': sha256_file(target),
                      })

              archive_report['archives'].append({
                  'label': label,
                  'source': archive_path.relative_to(root).as_posix(),
                  'sha256': sha256_file(archive_path),
                  'files_extracted': len(extracted),
                  'bytes_extracted': sum(int(item['size']) for item in extracted),
                  'files': extracted,
                  'skipped_metadata': skipped,
              })

          (inventory_dir / 'archive_inventory.json').write_text(
              json.dumps(archive_report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Build repository documentation catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          inventory_dir = root / 'docs' / 'inventory'
          inventory_dir.mkdir(parents=True, exist_ok=True)

          document_extensions = {
              '.md', '.markdown', '.txt', '.rst', '.adoc', '.pdf', '.docx',
              '.html', '.htm', '.csv', '.json', '.yaml', '.yml', '.xml'
          }
          text_extensions = {
              '.md', '.markdown', '.txt', '.rst', '.adoc', '.html', '.htm',
              '.csv', '.json', '.yaml', '.yml', '.xml'
          }
          excluded_parts = {
              '.git', 'vendor', 'node_modules', 'storage', 'bootstrap/cache',
              'public/build', '.worktrees'
          }

          def is_excluded(path: Path) -> bool:
              relative = path.relative_to(root).as_posix()
              return any(relative == item or relative.startswith(item + '/') for item in excluded_parts)

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def origin(path: Path) -> str:
              relative = path.relative_to(root).as_posix()
              if relative.startswith('docs/inbox/archive-1/'):
                  return 'archive-1'
              if relative.startswith('docs/inbox/archive-2/'):
                  return 'archive-2'
              return 'current-main'

          def title_for(path: Path) -> str:
              if path.suffix.lower() not in text_extensions:
                  return path.stem
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')[:16000]
              except OSError:
                  return path.stem
              for line in text.splitlines():
                  candidate = line.strip()
                  if not candidate:
                      continue
                  candidate = re.sub(r'^#{1,6}\s*', '', candidate)
                  candidate = re.sub(r'^[-=*]{3,}$', '', candidate).strip()
                  if candidate:
                      return candidate[:180]
              return path.stem

          documents: list[dict[str, object]] = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or is_excluded(path):
                  continue
              relative = path.relative_to(root)
              suffix = path.suffix.lower()
              is_root_doc = len(relative.parts) == 1 and suffix in document_extensions
              is_docs_doc = relative.parts and relative.parts[0] == 'docs' and suffix in document_extensions
              if not (is_root_doc or is_docs_doc):
                  continue
              digest = sha256_file(path)
              documents.append({
                  'path': relative.as_posix(),
                  'origin': origin(path),
                  'extension': suffix,
                  'size': path.stat().st_size,
                  'sha256': digest,
                  'title': title_for(path),
              })

          groups: dict[str, list[str]] = defaultdict(list)
          for item in documents:
              groups[str(item['sha256'])].append(str(item['path']))
          duplicate_groups = [
              {'sha256': digest, 'paths': paths}
              for digest, paths in sorted(groups.items())
              if len(paths) > 1
          ]

          report = {
              'generated_from_main_sha': 'e565d7594e062c6705be9747bee0bd6081beb137',
              'document_count': len(documents),
              'duplicate_group_count': len(duplicate_groups),
              'documents': documents,
              'exact_duplicate_groups': duplicate_groups,
          }
          (inventory_dir / 'documentation_catalogue.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          origin_counts: dict[str, int] = defaultdict(int)
          for item in documents:
              origin_counts[str(item['origin'])] += 1

          lines = [
              '# Documentation Reconciliation Inventory',
              '',
              '> Generated automatically from the documentation reconciliation branch. No document is classified as superseded solely because it is duplicated or old.',
              '',
              '## Inventory summary',
              '',
              f'- Documents catalogued: **{len(documents)}**',
              f'- Exact duplicate groups: **{len(duplicate_groups)}**',
              f"- Existing repository documents: **{origin_counts.get('current-main', 0)}**",
              f"- Documents extracted from Archive.zip: **{origin_counts.get('archive-1', 0)}**",
              f"- Documents extracted from Archive 2.zip: **{origin_counts.get('archive-2', 0)}**",
              '',
              '## Exact duplicate groups',
              '',
          ]
          if duplicate_groups:
              for index, group in enumerate(duplicate_groups, start=1):
                  lines.append(f"### Duplicate group {index}")
                  lines.append('')
                  lines.append(f"SHA-256: `{group['sha256']}`")
                  lines.append('')
                  for path in group['paths']:
                      lines.append(f'- `{path}`')
                  lines.append('')
          else:
              lines.extend(['No exact duplicates detected.', ''])

          lines.extend([
              '## Review rules',
              '',
              '1. Preserve one canonical current document for every active subject.',
              '2. Merge unique facts from superseded documents before deletion.',
              '3. Move historical evidence to `docs/archive/` rather than presenting it as current guidance.',
              '4. Keep source provenance and verification failures even when the related implementation is superseded.',
              '5. Update links before relocating or deleting documents.',
              '6. Never treat filename date, file size or branch age alone as proof of authority.',
              '',
              '## Next step',
              '',
              'Review each subject cluster and record one disposition: `canonical`, `merge-into`, `historical`, `superseded-delete`, or `reference-only`.',
              '',
          ])
          (root / 'docs' / 'DOCUMENTATION_RECONCILIATION_STATUS.md').write_text(
              '\n'.join(lines), encoding='utf-8'
          )
          PY

      - name: Commit extracted documentation and inventories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/inbox docs/inventory docs/DOCUMENTATION_RECONCILIATION_STATUS.md
          if git diff --cached --quiet; then
            echo 'No archive extraction changes to commit.'
            exit 0
          fi
          git commit -m 'docs: extract archives and generate reconciliation inventory'
          git push origin HEAD:agent/documentation-reconciliation
