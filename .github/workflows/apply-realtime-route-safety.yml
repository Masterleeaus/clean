name: Apply Realtime Route Safety Repair

on:
  pull_request:
    branches:
      - agent/gpt56-titan-zero-upgrade-review-base
    paths:
      - .github/realtime-route-safety-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact realtime controller repair
        run: php tools/titan-zero-audit/apply-realtime-route-safety.php

      - name: Verify syntax and route inspection contract
        run: |
          php -l app/Http/Controllers/Api/AIRealTimeChatController.php
          php -l app/Models/Concerns/HasCacheFirst.php
          php tests/Feature/Bootstrap/RouteInspectionSafetyTest.php

      - name: Commit repaired realtime controller
        run: |
          if git diff --quiet -- app/Http/Controllers/Api/AIRealTimeChatController.php; then
            echo "Realtime controller already repaired."
            exit 0
          fi
          git config user.name "Titan Zero Pass 2 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/Http/Controllers/Api/AIRealTimeChatController.php
          git commit -m "fix: defer realtime AI setup until request execution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
